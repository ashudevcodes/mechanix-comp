name: MechaOS compositer Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libgbm-dev \
            libxkbcommon-dev \
            libegl1-mesa-dev \
            libwayland-dev \
            libinput-dev \
            libdrm-dev \
            libseat-dev

      - name: Update Rust
        run: rustup update stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: compositor
          path: target/release/compositor
